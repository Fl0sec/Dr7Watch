name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: build.bat
      - name: Smoke test
        shell: pwsh
        run: |
          .\build\dr7watch.exe "$env:SystemRoot\System32\cmd.exe" /c ver
          if ($LASTEXITCODE -ne 0) { exit 1 }
